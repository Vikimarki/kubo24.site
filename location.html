<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05070b" />
<title>Destination — Chronos</title>
<meta name="description" content="The destination for the moment you have been waiting for." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305070b'/%3E%3Cpath d='M32 14c-7.7 0-14 6.3-14 14 0 10.5 14 22 14 22s14-11.5 14-22c0-7.7-6.3-14-14-14Z' fill='none' stroke='%23e3c39a' stroke-width='2'/%3E%3Ccircle cx='32' cy='28' r='4.5' fill='%23e3c39a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #05070b;
  --fg: #f2efe9;
  --fg-70: rgba(242, 239, 233, 0.7);
  --fg-55: rgba(242, 239, 233, 0.55);
  --fg-38: rgba(242, 239, 233, 0.38);
  --accent: #e3c39a;
  --accent-bright: #f0d6b2;
  --line: rgba(242, 239, 233, 0.1);
  --line-strong: rgba(242, 239, 233, 0.2);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --serif: "Bodoni Moda", "Times New Roman", serif;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  background: var(--ink);
  color: var(--fg);
  font-family: var(--sans);
  font-weight: 300;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: rgba(227, 195, 154, 0.28);
  color: var(--fg);
}

:focus-visible {
  outline: 2px solid rgba(227, 195, 154, 0.8);
  outline-offset: 3px;
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background:
    radial-gradient(110% 85% at 18% 18%, #14202a 0%, #080d13 48%, #04060a 100%);
}

.scene-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
  opacity: 0;
  filter: saturate(0.95) contrast(1.04) brightness(1.06);
  transform: scale(1.04);
  transition: opacity 1.4s ease;
}

.scene-image.is-loaded {
  opacity: 0.85;
}

.scene-glow {
  position: absolute;
  inset: -25%;
  background:
    radial-gradient(circle at 76% 28%, rgba(227, 195, 154, 0.13), transparent 38%),
    radial-gradient(circle at 20% 82%, rgba(92, 168, 255, 0.08), transparent 42%);
  animation: breathe 22s ease-in-out infinite alternate;
}

.scene-shade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(5, 7, 11, 0.7) 0%, rgba(5, 7, 11, 0.28) 55%, rgba(5, 7, 11, 0.44) 100%),
    linear-gradient(0deg, rgba(5, 7, 11, 0.7), transparent 52%);
}

.shell {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  padding: clamp(20px, 3vw, 36px) clamp(20px, 4vw, 52px) clamp(16px, 2.2vw, 26px);
}

.topline {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 18px;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-55);
}

.topline-date {
  margin: 0;
  font-variant-numeric: tabular-nums;
  color: var(--fg-70);
}

.layout {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(0, 0.58fr);
  gap: clamp(28px, 4.5vw, 64px);
  align-items: center;
  padding: clamp(36px, 7vh, 84px) 0;
}

.intro {
  max-width: 620px;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  margin: 0 0 22px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.kicker::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px rgba(227, 195, 154, 0.08);
}

.address {
  max-width: 18ch;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(32px, 3.6vw, 50px);
  font-weight: 400;
  line-height: 1.04;
  letter-spacing: -0.025em;
  text-wrap: balance;
  overflow-wrap: break-word;
  color: #fffdf8;
  text-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
}

.info-pill {
  display: flex;
  width: fit-content;
  max-width: 100%;
  align-items: center;
  gap: 14px;
  margin: 20px 0 0;
  padding: 12px 21px;
  border: 1px solid rgba(227, 195, 154, 0.32);
  border-radius: 999px;
  background: rgba(5, 7, 11, 0.32);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  font-family: var(--sans);
  font-size: 16.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--accent-bright);
}

.info-pill + .info-pill {
  margin-top: 12px;
}

.info-pill::before {
  content: "";
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 6px rgba(227, 195, 154, 0.08);
}

.actions {
  margin-top: clamp(26px, 4vh, 38px);
}

.maps-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 54px;
  padding: 0 26px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--accent-bright), #dcb887);
  color: #171009;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.34), 0 0 34px rgba(227, 195, 154, 0.12);
  transition: transform 0.3s var(--ease), box-shadow 0.3s ease, opacity 0.3s ease;
}

.maps-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 46px rgba(0, 0, 0, 0.4), 0 0 42px rgba(227, 195, 154, 0.2);
}

.maps-btn:active {
  transform: translateY(0);
}

.maps-btn svg {
  width: 15px;
  height: 15px;
  transition: transform 0.3s var(--ease);
}

.maps-btn:hover svg {
  transform: translate(2px, -2px);
}

.maps-btn[aria-disabled="true"] {
  background: rgba(255, 255, 255, 0.03);
  border-color: var(--line-strong);
  color: var(--fg-55);
  box-shadow: none;
  pointer-events: none;
  cursor: not-allowed;
}

.map-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  min-height: clamp(226px, 38vh, 428px);
}

@media (min-width: 901px) {
  .map-panel {
    translate: 0 30%;
  }
}

.map-frame {
  position: relative;
  flex: 1;
  min-height: clamp(202px, 34.5vh, 393px);
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 22px;
  background:
    radial-gradient(circle at 50% 42%, rgba(227, 195, 154, 0.08), transparent 36%),
    linear-gradient(155deg, #0d141b, #06090e 70%);
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.map-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.025);
}

.map-frame iframe {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  pointer-events: none;
  filter: saturate(0.85) contrast(1.04);
  transition: opacity 0.7s ease;
}

.map-frame.is-ready iframe {
  opacity: 1;
  pointer-events: auto;
}

.map-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 36px;
  text-align: center;
  background:
    repeating-linear-gradient(0deg, transparent 0 46px, rgba(242, 239, 233, 0.035) 46px 47px),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(242, 239, 233, 0.035) 46px 47px);
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.map-frame.is-ready .map-placeholder {
  opacity: 0;
  visibility: hidden;
}

.map-placeholder::before,
.map-placeholder::after {
  content: "";
  position: absolute;
  background: rgba(242, 239, 233, 0.05);
  pointer-events: none;
}

.map-placeholder::before {
  left: 0;
  right: 0;
  top: 38%;
  height: 1px;
  transform: rotate(-8deg);
}

.map-placeholder::after {
  top: 0;
  bottom: 0;
  left: 61%;
  width: 1px;
  transform: rotate(12deg);
}

.pin {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border: 1px solid rgba(227, 195, 154, 0.36);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 30%, rgba(227, 195, 154, 0.2), rgba(227, 195, 154, 0.03) 70%);
  color: var(--accent);
  box-shadow: 0 0 0 10px rgba(227, 195, 154, 0.03), 0 0 54px rgba(227, 195, 154, 0.12);
}

.pin svg {
  width: 25px;
  height: 25px;
}

.map-placeholder p {
  position: relative;
  z-index: 1;
  margin: 6px 0 0;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-70);
}

.map-placeholder span {
  position: relative;
  z-index: 1;
  max-width: 30ch;
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: 0.02em;
  color: var(--fg-55);
}

.map-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 4px;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-55);
}

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-top: clamp(16px, 2.4vw, 24px);
  border-top: 1px solid var(--line);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-38);
}

.reveal {
  opacity: 0;
  transform: translateY(18px);
  animation: rise 0.95s var(--ease) forwards;
  animation-delay: var(--d, 0ms);
}

@keyframes rise {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  from {
    transform: scale(1);
    opacity: 0.75;
  }
  to {
    transform: scale(1.08);
    opacity: 1;
  }
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
    gap: clamp(24px, 4vh, 34px);
    padding: clamp(28px, 5vh, 42px) 0 24px;
    align-items: stretch;
  }

  .intro {
    max-width: 640px;
  }

  .address {
    max-width: 100%;
    font-size: clamp(32px, 8.6vw, 52px);
  }

  .map-panel {
    min-height: clamp(246px, 34vh, 340px);
  }

  .map-frame {
    min-height: clamp(225px, 31vh, 306px);
  }

  .scene-shade {
    background:
      linear-gradient(90deg, rgba(5, 7, 11, 0.66) 0%, rgba(5, 7, 11, 0.32) 45%, rgba(5, 7, 11, 0.46) 100%),
      linear-gradient(0deg, rgba(5, 7, 11, 0.75) 12%, rgba(5, 7, 11, 0.28) 58%, transparent 82%);
  }
}

@media (max-width: 560px) {
  .shell {
    padding: 18px 18px 20px;
  }

  .topline {
    font-size: 9px;
    letter-spacing: 0.14em;
  }

  .layout {
    padding-top: 24px;
  }

  .maps-btn {
    width: 100%;
  }

  .map-placeholder {
    padding: 24px;
  }

  .footer {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <img class="scene-image" id="sceneImage" alt="" />
  <div class="scene-glow"></div>
  <div class="scene-shade"></div>
</div>

<main class="shell">
  <header class="topline reveal" style="--d:0ms">
    <p class="topline-date">31 · 10 · 2026</p>
  </header>

  <div class="layout">
    <section class="intro">
      <p class="kicker reveal" style="--d:90ms">The destination</p>
      <h1 class="address reveal" id="address" style="--d:160ms" hidden></h1>
      <p class="info-pill reveal" style="--d:220ms">Beöltözni kötelező!</p>
      <p class="info-pill reveal" style="--d:260ms">Private taxi</p>

      <div class="actions reveal" style="--d:310ms">
        <a class="maps-btn" id="mapsLink" aria-disabled="true" tabindex="-1">
          Open in Google Maps
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7" />
            <path d="M8 7h9v9" />
          </svg>
        </a>
      </div>
    </section>

    <section class="map-panel reveal" style="--d:240ms" aria-label="Destination map">
      <div class="map-frame" id="mapFrameWrap">
        <iframe id="mapFrame" title="Map showing the destination address" allowfullscreen></iframe>
        <div class="map-placeholder" id="mapPlaceholder">
          <div class="pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.6" />
            </svg>
          </div>
          <p id="mapPlaceholderTitle">Map preview</p>
          <span id="mapPlaceholderText">Add the address to load the interactive map.</span>
        </div>
      </div>
      <div class="map-caption">
        <span>Location</span>
        <span>Google Maps</span>
      </div>
    </section>
  </div>

  <footer class="footer reveal" style="--d:440ms">
    <span>See you there</span>
    <span>October 31, 2026</span>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var LOCATION = {
    address: 'Bodzianske Lúky 1, 946 14 Bodzianske Lúky',
    mapQuery: '47.8874582,17.8968416',
    shareUrl: 'https://maps.app.goo.gl/sfH8Nh7TzohWXjsM8',
    background: 'location-bg.jpg',
    zoom: 17
  };

  var addressEl = document.getElementById('address');
  var mapFrame = document.getElementById('mapFrame');
  var mapFrameWrap = document.getElementById('mapFrameWrap');
  var mapsLink = document.getElementById('mapsLink');
  var sceneImage = document.getElementById('sceneImage');
  var mapPlaceholderTitle = document.getElementById('mapPlaceholderTitle');
  var mapPlaceholderText = document.getElementById('mapPlaceholderText');

  var address = String(LOCATION.address || '').trim();
  var isPlaceholder = address === '' || /^\[.*\]$/.test(address) || address.toLowerCase().indexOf('will be added') !== -1;

  if (!isPlaceholder) {
    addressEl.textContent = address;
    addressEl.hidden = false;
  }

  function revealBackground() {
    if (!sceneImage) return;
    sceneImage.addEventListener('load', function () {
      sceneImage.classList.add('is-loaded');
    });
    sceneImage.addEventListener('error', function () {
      sceneImage.remove();
      sceneImage = null;
    });
    sceneImage.src = LOCATION.background;
  }

  if (LOCATION.background) revealBackground();

  if (isPlaceholder) {
    mapsLink.setAttribute('aria-disabled', 'true');
    mapsLink.setAttribute('tabindex', '-1');
    mapsLink.addEventListener('click', function (event) {
      event.preventDefault();
    });
    return;
  }

  var query = encodeURIComponent(LOCATION.mapQuery || address);
  var zoom = Number(LOCATION.zoom) || 17;

  mapPlaceholderTitle.textContent = 'Loading map';
  mapPlaceholderText.textContent = 'Connecting to Google Maps.';

  mapFrame.addEventListener('load', function () {
    mapFrameWrap.classList.add('is-ready');
  });
  mapFrame.src = 'https://www.google.com/maps?q=' + query + '&z=' + zoom + '&output=embed';

  window.setTimeout(function () {
    if (mapFrameWrap.classList.contains('is-ready')) return;
    mapPlaceholderTitle.textContent = 'Map unavailable';
    mapPlaceholderText.textContent = 'Use Open in Google Maps to view the destination.';
  }, 9000);

  mapsLink.href = LOCATION.shareUrl || 'https://www.google.com/maps/search/?api=1&query=' + query;
  mapsLink.target = '_blank';
  mapsLink.rel = 'noopener noreferrer';
  mapsLink.removeAttribute('aria-disabled');
  mapsLink.removeAttribute('tabindex');
})();
</script>
</body>
</html>
